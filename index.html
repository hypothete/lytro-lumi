<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lytro-lumi: lumigraph for viewing Lytro photos</title>
  </head>
  <body>
    <main>
      <div id="three"></div>
        <div id="controls">
          <label><input type="checkbox" id="zoomin">Zoom in?</label>
          <label><input type="checkbox" id="renderpass">Show count pass</label>
          <label><input type="range" id="aperture" min="0" max="100" step="1"/>Aperture</label>
          <label><input type="range" id="focus" min="0" max="7" step="0.01"/>Focus</label>
          <label><input type="range" id="xoffset" min="-0.5" max="0.5" step="0.01"/>X offset</label>
          <label><input type="range" id="yoffset" min="-0.5" max="0.5" step="0.01"/>Y offset</label>
          <a href="https://github.com/hypothete/lytro-lumi">View on GitHub</a>
        </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
