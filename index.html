<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta property="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="lytro-lumi">
    <meta name="description" content="Lumigraph for viewing Lytro photos">
    <meta property="og:description" content="Lumigraph for viewing Lytro photos">
    <meta property="og:image" content="./flowers-closeup.jpg">
    <title>lytro-lumi: lumigraph for viewing Lytro photos</title>
  </head>
  <body>
    <main>
      <div id="three"></div>
        <div id="controls">
          <label><input type="checkbox" id="zoomin">Zoom in?</label>
          <label><input type="range" id="aperture" min="0" max="100" step="0.1"/>Aperture</label>
          <label><input type="range" id="focus" min="0" max="7" value="2" step="0.01"/>Focal Distance</label>
          <div>
            <button id="record">Record video</button>
            <!-- <a href="" id="download" download="lumi.webm"></a> -->
            <a href="" id="download" target="_blank"></a>
          </div>
          <p>
            Click or touch and drag to shift the perspective of the image. Different focal distances can cause the parallax to be stronger or weaker.
          </p>
          <a href="https://github.com/hypothete/lytro-lumi">View on GitHub</a>
        </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
